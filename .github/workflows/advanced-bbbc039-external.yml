name: BBBC039 official external fluorescence test (original 16-bit)

on:
  push:
    branches:
      - advancement/a04-modality-aware-external-bbbc039
    paths:
      - '.github/workflows/advanced-bbbc039-external.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-bbbc039:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/advanced/requirements.txt
      - name: Install scientific Python packages
        run: |
          python -m pip install -U pip
          python -m pip install -r projects/advanced/requirements.txt
      - name: Run deterministic contract tests without original data
        run: |
          python -m pytest -q tests/test_advanced_modality_bbbc039.py
      - name: Download ORIGINAL Broad BBBC039 archives
        shell: bash
        run: |
          set -euo pipefail
          base="https://data.broadinstitute.org/bbbc/BBBC039"
          DATA="${RUNNER_TEMP}/BBBC039v1"
          mkdir -p "$DATA" artifacts/bbbc039
          for name in images.zip masks.zip metadata.zip; do
            curl --fail --location --retry 3 --retry-all-errors --max-time 1200 \
              --output "$DATA/$name" "$base/$name"
          done
          sha256sum "$DATA"/images.zip "$DATA"/masks.zip "$DATA"/metadata.zip \
            | sed "s|$DATA/||g" > artifacts/bbbc039/BROAD_SOURCE_SHA256.txt
          for name in images masks metadata; do
            unzip -t "$DATA/$name.zip" | tail -n 1
            unzip -q "$DATA/$name.zip" -d "$DATA"
          done
      - name: Score two FIXED algorithms on official test.txt only
        shell: bash
        run: |
          set -euo pipefail
          DATA="${RUNNER_TEMP}/BBBC039v1"
          python -m projects.advanced.a03.run_external_bbbc039 \
            --root "$DATA" --out artifacts/bbbc039 \
            | tee artifacts/bbbc039/external_test_console.txt
          echo '## BBBC039 original official test' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/bbbc039/BBBC039_EXTERNAL_RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload scientific results (no original microscopy images)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bbbc039-original-external-16bit-metrics
          path: artifacts/bbbc039/
          retention-days: 90
          if-no-files-found: warn
