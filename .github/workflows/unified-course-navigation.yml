name: Unified 33-chapter course navigation QA
on:
  push:
    branches:
      - feature/unified-33-chapter-navigation
  pull_request:
    paths:
      - index.html
      - src/course-adapter.js
      - src/ui-first.js
      - src/ui-first-2.js
      - src/ui-first-2.css
      - tests/unified_course_navigation.test.mjs
      - tests/test_unified_course_navigation_browser.py
      - .github/workflows/unified-course-navigation.yml
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Inspect 33 JSON chapters and grouping contract
        run: |
          node --test tests/unified_course_navigation.test.mjs
          npm test
      - name: Install browser engine
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Android and desktop navigation regression across all stages
        run: python tests/test_unified_course_navigation_browser.py
