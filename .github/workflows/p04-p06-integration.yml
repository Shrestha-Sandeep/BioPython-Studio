name: P04-P06 six-chapter integration
on:
  push:
    branches: ['integration/p04-p06-ui-first']
  pull_request:
    paths:
      - 'src/course-*'
      - 'index.html'
      - 'content/p04/**'
      - 'content/p05/**'
      - 'content/p06/**'
      - 'content/chapters/P04_COMPLETE.md'
      - 'content/chapters/P05_COMPLETE.md'
      - 'content/chapters/P06_COMPLETE.md'
      - 'docs/P06_LOCAL_HANDOFF.md'
      - 'tests/test_p04_p06*'
      - '.github/workflows/p04-p06-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p04-p06:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: JavaScript syntax and original UI tests
        run: |
          node --check src/ui-first.js
          node --check src/course-adapter.js
          node --check src/course-teaching.js
          node --check src/p01-worker.mjs
          node --test tests/preview.test.mjs tests/witz_sources.test.mjs
      - name: P01-P06 import, task, feedback and author reference contracts
        run: |
          python tests/test_p01_import.py
          python tests/test_p02_import.py
          python tests/test_p03_import.py
          python tests/test_editor_briefs.py
          python tests/test_capstone_technique_probes.py
          python tests/test_p04_p06_import.py
          python tests/test_p04_p06_reference.py
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Original frozen UI regression
        run: python tests/browser_smoke.py
      - name: P01 browser regression
        run: python tests/test_p01_browser.py
      - name: P02 browser regression
        run: python tests/test_p02_browser.py
      - name: P03 all 85 Pyodide reference cases
        run: python tests/test_p03_browser.py
      - name: P04-P06 all 155 Pyodide reference cases, exports and responsiveness
        run: python tests/test_p04_p06_browser.py
      - name: Retain P04-P06 mobile, tablet, desktop screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p04-p06-qa
          path: artifacts/p04-p06/*.png
          if-no-files-found: ignore
          retention-days: 14
