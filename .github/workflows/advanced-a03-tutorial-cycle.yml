name: Advanced A03 instance-validation tutorial QA
on:
  push:
    branches:
      - feature/advanced-tutorial-cycle-a03
  pull_request:
    paths:
      - 'src/tutorials/a03-data.js'
      - 'src/tutorials/advanced-illustrations.js'
      - 'src/tutorials/p01-viewer.js'
      - 'index.html'
      - 'tests/a03_tutorials.test.mjs'
      - 'tests/test_a03_tutorial_browser.py'
      - 'docs/tutorials/A03_RESEARCH_BLUEPRINT.md'
      - '.github/workflows/advanced-a03-tutorial-cycle.yml'
permissions:
  contents: read
jobs:
  a03-instance-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install actual native scientific dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-image==0.26.0 tifffile==2026.11.12 playwright==1.56.0
      - name: Execute all original A00-A03 Python outputs and independent changed-input cases
        run: |
          node --check src/tutorials/advanced-illustrations.js
          node --check src/tutorials/a03-data.js
          node --check src/tutorials/p01-viewer.js
          node --test tests/a00_tutorials.test.mjs tests/a01_tutorials.test.mjs tests/a02_tutorials.test.mjs tests/a03_tutorials.test.mjs
      - name: Install Chromium browser
        run: python -m playwright install --with-deps chromium
      - name: Full desktop/mobile A00-A03 and P01 visual and learner-state regression
        run: |
          python tests/test_a00_tutorial_browser.py
          python tests/test_a01_tutorial_browser.py
          python tests/test_a02_tutorial_browser.py
          python tests/test_a03_tutorial_browser.py
          python tests/test_p01_tutorial_browser.py
