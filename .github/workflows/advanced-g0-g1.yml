name: Advanced G0-G3 scientific Python and frozen-curriculum QA

on:
  pull_request:
    paths:
      - 'projects/advanced/**'
      - 'docs/ADVANCEMENT_*'
      - 'tests/test_advanced_*'
      - 'content/a0*/**'
      - 'content/chapters/A0*'
      - 'src/course-adapter.js'
      - '.github/workflows/advanced-g0-g1.yml'
  push:
    branches:
      - 'advancement/**'
  workflow_dispatch:

jobs:
  native-audit-segmentation-and-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/advanced/requirements.txt
      - name: Install native dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r projects/advanced/requirements.txt
      - name: Full advanced and frozen inventory contracts
        run: |
          python -m pytest -q tests/test_advanced_g0_contract.py tests/test_advanced_image_audit.py tests/test_advanced_segmentation_validation.py tests/test_advanced_bbbc038_official.py tests/test_advanced_modality_bbbc039.py tests/test_advanced_learning_import.py tests/test_advanced_a00_a05_a06_a07.py tests/test_advanced_core_learning.py tests/test_advanced_scientific_gaps.py
      - name: CLI and bytecode smoke
        run: |
          python projects/advanced/a01/image_audit.py --help
          python -m projects.advanced.a02.run_tiff --help
          python -m projects.advanced.a02.sensitivity --help
          python -m projects.advanced.a03.benchmark --help
          python -m projects.advanced.a00.bridge --help
          python -m projects.advanced.a05.analysis --help
          python -m projects.advanced.a06.batch --help
          python -m projects.advanced.a07.evidence_check --help
          python -m py_compile projects/advanced/a00/bridge.py projects/advanced/a05/analysis.py projects/advanced/a06/batch.py projects/advanced/a07/evidence_check.py projects/advanced/a01/quality.py projects/advanced/a02/puncta.py projects/advanced/a03/annotator_agreement.py
          python -m py_compile projects/advanced/a01/image_audit.py projects/advanced/a02/segmentation.py projects/advanced/a02/run_tiff.py projects/advanced/a02/sensitivity.py projects/advanced/a03/dataset.py projects/advanced/a03/metrics.py projects/advanced/a03/benchmark.py projects/advanced/a03/prepare_bbbc038.py projects/advanced/a03/run_official_bbbc038.py projects/advanced/a02b/modality.py projects/advanced/a03/bbbc039.py projects/advanced/a03/run_external_bbbc039.py
