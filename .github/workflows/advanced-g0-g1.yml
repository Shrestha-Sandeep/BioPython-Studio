name: Advanced G0-G3 scientific Python and frozen-curriculum QA

on:
  pull_request:
    paths:
      - 'projects/advanced/**'
      - 'docs/ADVANCEMENT_*'
      - 'tests/test_advanced_*'
      - '.github/workflows/advanced-g0-g1.yml'
  push:
    branches:
      - 'advancement/**'
  workflow_dispatch:

jobs:
  native-audit-segmentation-and-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/advanced/requirements.txt
      - name: Install native dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r projects/advanced/requirements.txt
      - name: Full advanced and frozen inventory contracts
        run: |
          python -m pytest -q tests/test_advanced_g0_contract.py tests/test_advanced_image_audit.py tests/test_advanced_segmentation_validation.py
      - name: CLI and bytecode smoke
        run: |
          python projects/advanced/a01/image_audit.py --help
          python -m projects.advanced.a02.run_tiff --help
          python -m projects.advanced.a02.sensitivity --help
          python -m projects.advanced.a03.benchmark --help
          python -m py_compile projects/advanced/a01/image_audit.py projects/advanced/a02/segmentation.py projects/advanced/a02/run_tiff.py projects/advanced/a02/sensitivity.py projects/advanced/a03/dataset.py projects/advanced/a03/metrics.py projects/advanced/a03/benchmark.py
