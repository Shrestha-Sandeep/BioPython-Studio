name: UI-first-2 learning-first QA
on:
  push:
    branches: ['ui-first-2']
  pull_request:
    paths:
      - 'src/ui-first-2.js'
      - 'src/ui-first-2.css'
      - 'src/course-adapter.js'
      - 'src/ui-first.js'
      - 'index.html'
      - 'tests/ui_first_2_browser.py'
      - 'tests/preview.test.mjs'
      - 'src/tutorials/**'
      - 'tests/p01_tutorials.test.mjs'
      - 'tests/test_p01_tutorial_browser.py'
permissions:
  contents: read
jobs:
  ui-first-2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax and UI contracts
        run: |
          node --check src/ui-first.js
          node --check src/ui-first-2.js
          node --check src/course-adapter.js
          node --check src/tutorials/p01-data.js
          node --check src/tutorials/p01-viewer.js
          node --test tests/preview.test.mjs tests/witz_sources.test.mjs tests/p01_tutorials.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Preserve course inventory and storage contracts
        run: python tests/test_release_candidate_contract.py
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser UI and real lesson integration
        run: python tests/ui_first_2_browser.py
      - name: P01 narrated tutorial browser flow
        run: python tests/test_p01_tutorial_browser.py
      - name: Store mobile/desktop screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-first-2-screenshots
          path: artifacts/ui-first-2/*.png
          if-no-files-found: ignore
          retention-days: 14
