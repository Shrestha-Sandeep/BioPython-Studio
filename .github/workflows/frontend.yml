name: UI-first frontend checks
on:
  push:
    branches: ['feature/ui-first-ide-workspace']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/ui-first.js && node --check src/course.js && node --check src/witz-lessons.js
      - run: node --test tests/preview.test.mjs tests/witz_sources.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - name: Keep responsive UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-preview-screenshots
          path: artifacts/ui-preview/*.png
          if-no-files-found: ignore
          retention-days: 14
