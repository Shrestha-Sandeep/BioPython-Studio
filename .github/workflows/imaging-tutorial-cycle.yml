name: Imaging narrated tutorial research-loop QA
on:
  push:
    branches:
      - feature/imaging-tutorial-cycle-i01-i02
  pull_request:
    paths:
      - 'src/tutorials/i0*-data.js'
      - 'src/tutorials/imaging-illustrations.js'
      - 'src/tutorials/p01-viewer.js'
      - 'index.html'
      - 'tests/imaging_tutorials.test.mjs'
      - 'tests/test_imaging_tutorial_browser.py'
      - 'docs/tutorials/**'
permissions:
  contents: read
jobs:
  imaging-tutorial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install numerical scientific and browser test dependencies
        run: python -m pip install numpy==2.3.5 pillow==12.3.0 playwright==1.56.0
      - name: Validate modules and real Python numerical outputs
        run: |
          node --check src/tutorials/i01-data.js
          node --check src/tutorials/i02-data.js
          node --check src/tutorials/imaging-illustrations.js
          node --check src/tutorials/p01-viewer.js
          node --test tests/imaging_tutorials.test.mjs tests/foundation_visuals.test.mjs tests/microscopy_storyboard.test.mjs
      - name: Install browser engine
        run: python -m playwright install --with-deps chromium
      - name: Check staged lesson UI on desktop and mobile
        run: python tests/test_imaging_tutorial_browser.py
