name: P01 UI-first integration
on:
  push:
    branches: ['integration/p01-ui-first-pilot']
  pull_request:
    paths: ['src/p01-*','src/ui-first.js','index.html','content/p01/**','content/chapters/P01_COMPLETE.md','tests/test_p01*','.github/workflows/p01-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p01:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: JavaScript syntax
        run: node --check src/ui-first.js && node --check src/p01-adapter.js && node --check src/p01-worker.mjs
      - name: Original frozen UI regression tests
        run: node --test tests/preview.test.mjs tests/witz_sources.test.mjs
      - name: Author-free P01 import contract
        run: python tests/test_p01_import.py
      - name: Install Chromium for genuine Pyodide smoke test
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Real Python browser flow
        run: python tests/test_p01_browser.py
      - name: Preserve P01 responsive screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p01-full-chapter-qa
          path: artifacts/p01/*.png
          if-no-files-found: ignore
          retention-days: 14
