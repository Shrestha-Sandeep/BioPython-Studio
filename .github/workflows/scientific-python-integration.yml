name: Scientific Python I01 runtime and regression
on:
  push:
    branches: ['integration/scientific-python-foundations']
  pull_request:
    paths:
      - 'src/p01-worker.mjs'
      - 'src/course-*'
      - 'src/ui-first.js'
      - 'src/p01-pilot.css'
      - 'content/i01/**'
      - 'content/chapters/I01_COMPLETE.md'
      - 'tests/test_i01*'
      - 'tests/reference_i01.json'
      - '.github/workflows/scientific-python-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  microscopy-i01:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: JavaScript runtime syntax, frozen UI and source integrity
        run: |
          node --check src/ui-first.js
          node --check src/course-adapter.js
          node --check src/course-teaching.js
          node --check src/p01-worker.mjs
          node --test tests/preview.test.mjs tests/witz_sources.test.mjs
      - name: Scientific Python packages
        run: python -m pip install numpy pillow matplotlib
      - name: Canonical I01 contract and CPython reference cases
        run: |
          python tests/test_i01_import.py
          python tests/test_i01_reference.py
      - name: Preserve P01-P06 learner contracts
        run: |
          python tests/test_p01_import.py
          python tests/test_p02_import.py
          python tests/test_p03_import.py
          python tests/test_p04_p06_import.py
          python tests/test_p04_p06_reference.py
      - name: Browser testing dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Original frozen UI browser regression
        run: python tests/browser_smoke.py
      - name: Original P01 browser regression
        run: python tests/test_p01_browser.py
      - name: Complete six-chapter P04-P06 browser regression
        run: python tests/test_p04_p06_browser.py
      - name: Real I01 NumPy, Pillow, actual source image and Matplotlib browser QA
        run: python tests/test_i01_browser.py
