name: Android standalone installable PWA
on:
  push:
    branches:
      - feature/mobile-pwa-install
  pull_request:
    paths:
      - index.html
      - manifest.webmanifest
      - 'icons/**'
      - tests/mobile_pwa.test.mjs
      - tests/test_mobile_pwa_browser.py
      - .github/workflows/mobile-pwa.yml
permissions:
  contents: read
jobs:
  pwa-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Validate install metadata, actual 192/512 PNG and existing frontend
        run: |
          node --test tests/mobile_pwa.test.mjs
          npm test
      - name: Install actual Android-style mobile browser test runtime
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test standalone manifest and icon loading at phone and desktop viewport
        run: python tests/test_mobile_pwa_browser.py
