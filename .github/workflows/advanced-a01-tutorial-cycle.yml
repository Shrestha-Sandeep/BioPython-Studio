name: Advanced A01 native microscopy tutorial QA
on:
  push:
    branches:
      - feature/advanced-tutorial-cycle-a01
  pull_request:
    paths:
      - 'src/tutorials/a01-data.js'
      - 'src/tutorials/advanced-illustrations.js'
      - 'src/tutorials/p01-viewer.js'
      - 'index.html'
      - 'tests/a01_tutorials.test.mjs'
      - 'tests/test_a01_tutorial_browser.py'
      - 'docs/tutorials/A01_RESEARCH_BLUEPRINT.md'
      - '.github/workflows/advanced-a01-tutorial-cycle.yml'
permissions:
  contents: read
jobs:
  source-image-a01:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned genuine TIFF and browser test dependencies
        run: python -m pip install numpy==2.3.5 tifffile==2026.11.12 playwright==1.56.0
      - name: Validate tutorial source, original images and native numeric output
        run: |
          node --check src/tutorials/a00-data.js
          node --check src/tutorials/a01-data.js
          node --check src/tutorials/advanced-illustrations.js
          node --check src/tutorials/p01-viewer.js
          node --test tests/a00_tutorials.test.mjs tests/a01_tutorials.test.mjs
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Actual A00 and A01 phone/desktop source-and-state QA
        run: |
          python tests/test_a00_tutorial_browser.py
          python tests/test_a01_tutorial_browser.py
          python tests/test_p01_tutorial_browser.py
