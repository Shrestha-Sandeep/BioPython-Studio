name: BioPython quality
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy matplotlib pytest pillow playwright
      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check worker.js
      - name: Python evaluator tests
        run: python -m pytest -q tests/test_harness.py tests/test_chunk1.py
      - name: Browser smoke tests
        run: |
          python tests/check_browser_images.py
          python tests/check_learning_ui.py
