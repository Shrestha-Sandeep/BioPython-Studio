name: BioPython Studio quality
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install scientific Python and browser QA
        run: |
          python -m pip install --disable-pip-version-check numpy pandas scipy scikit-image scikit-learn biopython matplotlib pytest pillow playwright nbformat requests ipython
          python -m playwright install --with-deps chromium
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check worker.js
          node --check learning-state.js
          node --check pilot.js
          node --check milestones.js
          node --check course-path.js
          node --test tests/test_learning_state.cjs tests/test_milestones.cjs tests/test_course_path.cjs tests/test_witz_spine.cjs
      - name: Run all Python evaluations and companion notebook
        run: python -m pytest -q tests/test_harness.py tests/test_chunk1.py tests/test_full.py tests/test_notebook.py
      - name: Validate frozen v3 curriculum contract
        run: python -m pytest -q tests/test_curriculum_v3_contract.py tests/test_pilot.py tests/test_witz_spine.py
      - name: Browser lesson flow and image recovery
        run: python tests/test_complete_ui.py

      - name: Real Pyodide pilot and publisher images (no mocked Worker)
        run: python tests/test_pilot_ui.py
