name: Advanced A00 research-led narrated tutorial QA
on:
  push:
    branches:
      - feature/advanced-tutorial-cycle-*
  pull_request:
    paths:
      - 'src/tutorials/a*-data.js'
      - 'src/tutorials/advanced-illustrations.js'
      - 'src/tutorials/p01-viewer.js'
      - 'index.html'
      - 'tests/a*_tutorials.test.mjs'
      - 'tests/test_a*_tutorial_browser.py'
      - 'docs/tutorials/A*_RESEARCH_BLUEPRINT.md'
      - '.github/workflows/advanced-tutorial-cycle.yml'
permissions:
  contents: read
jobs:
  research-led-a00:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Validate original diagrams, actual Python results and changed-input guardrails
        run: |
          node --check src/tutorials/a00-data.js
          node --check src/tutorials/advanced-illustrations.js
          node --check src/tutorials/p01-viewer.js
          node --test tests/a00_tutorials.test.mjs tests/p01_tutorials.test.mjs
      - name: Install Playwright Chromium and browser checks
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Real advanced and frozen foundation mobile/desktop browser QA
        run: |
          python tests/test_a00_tutorial_browser.py
          python tests/test_p01_tutorial_browser.py
