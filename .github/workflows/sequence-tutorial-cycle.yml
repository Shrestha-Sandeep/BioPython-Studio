name: Sequence narrated tutorial research-loop QA
on:
  push:
    branches:
      - feature/sequence-tutorial-cycle-*
  pull_request:
    paths:
      - 'src/tutorials/n*-data.js'
      - 'src/tutorials/sequence-illustrations.js'
      - 'src/tutorials/p01-viewer.js'
      - 'index.html'
      - 'tests/sequence_tutorials.test.mjs'
      - 'tests/n02_tutorials.test.mjs'
      - 'tests/test_sequence_tutorial_browser.py'
      - 'tests/test_n02_tutorial_browser.py'
      - 'docs/tutorials/N*_RESEARCH_BLUEPRINT.md'
permissions:
  contents: read
jobs:
  sequence-tutorial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install actual Python science and browser libraries
        run: python -m pip install biopython==1.86 playwright==1.56.0
      - name: Validate syntax, provenance, examples and changed-input behavior
        run: |
          node --check src/tutorials/n01-data.js
          node --check src/tutorials/n02-data.js
          node --check src/tutorials/sequence-illustrations.js
          node --check src/tutorials/p01-viewer.js
          node --test tests/sequence_tutorials.test.mjs tests/n02_tutorials.test.mjs
          python tests/test_sequence_ml_import.py
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Verify responsive UI and independent tasks
        run: |
          python tests/test_sequence_tutorial_browser.py
          python tests/test_n02_tutorial_browser.py
