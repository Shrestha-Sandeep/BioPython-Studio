name: BBBC038 real original-image and official stage1-test benchmark

on:
  push:
    branches:
      - advancement/bbbc038-official-test-benchmark
    paths:
      - '.github/workflows/bbbc038-real-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-bbbc038-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/advanced/requirements.txt
      - name: Install scientific Python dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r projects/advanced/requirements.txt
      - name: Verify scientific code before external data
        run: |
          python -m pytest -q tests/test_advanced_bbbc038_official.py tests/test_advanced_segmentation_validation.py
      - name: Fetch ORIGINAL Broad BBBC038 stage1 source archives and solution
        shell: bash
        run: |
          set -euo pipefail
          export DATA_ROOT="${RUNNER_TEMP}/bbbc038-original"
          mkdir -p "$DATA_ROOT/train" "$DATA_ROOT/test" artifacts/bbbc038
          base="https://data.broadinstitute.org/bbbc/BBBC038"
          for file in stage1_train.zip stage1_test.zip stage1_solution.csv; do
            echo "Downloading original Broad source: $file"
            curl --fail --location --retry 3 --retry-all-errors \
              --connect-timeout 30 --max-time 1200 \
              --output "$DATA_ROOT/$file" "$base/$file"
          done
          sha256sum "$DATA_ROOT"/stage1_train.zip "$DATA_ROOT"/stage1_test.zip \
            "$DATA_ROOT"/stage1_solution.csv | sed "s|$DATA_ROOT/||g" \
            | tee artifacts/bbbc038/ORIGINAL_BROAD_SOURCE_SHA256.txt
          unzip -t "$DATA_ROOT/stage1_train.zip" | tail -n 1
          unzip -t "$DATA_ROOT/stage1_test.zip" | tail -n 1
          unzip -q "$DATA_ROOT/stage1_train.zip" -d "$DATA_ROOT/train"
          unzip -q "$DATA_ROOT/stage1_test.zip" -d "$DATA_ROOT/test"
      - name: Materialize published test-mask RLE and lock ORIGINAL split provenance
        shell: bash
        run: |
          set -euo pipefail
          DATA_ROOT="${RUNNER_TEMP}/bbbc038-original"
          python -m projects.advanced.a03.prepare_bbbc038 \
            --data-root "$DATA_ROOT" \
            --train-dir "$DATA_ROOT/train" \
            --test-dir "$DATA_ROOT/test" \
            --stage1-solution "$DATA_ROOT/stage1_solution.csv" \
            --output-manifest "$DATA_ROOT/dataset_manifest.json" \
            --calibration-size 40 \
            | tee artifacts/bbbc038/preparation_log.json
          cp "$DATA_ROOT/bbbc038_provenance.json" artifacts/bbbc038/source_provenance.json
          sha256sum "$DATA_ROOT/dataset_manifest.json" \
            | sed "s|$DATA_ROOT/||g" > artifacts/bbbc038/manifest_sha256.txt
      - name: Real calibration and official STAGE1 TEST benchmark
        shell: bash
        run: |
          set -euo pipefail
          DATA_ROOT="${RUNNER_TEMP}/bbbc038-original"
          OUT_ROOT="${RUNNER_TEMP}/bbbc038-evaluation"
          python -m projects.advanced.a03.run_official_bbbc038 \
            --data-root "$DATA_ROOT" \
            --manifest "$DATA_ROOT/dataset_manifest.json" \
            --output-root "$OUT_ROOT" --channel 0 \
            | tee artifacts/bbbc038/real_run_console.txt
          cp "$OUT_ROOT/REAL_BBBC038_RESULTS.md" artifacts/bbbc038/
          cp "$OUT_ROOT/REAL_BBBC038_RESULTS.json" artifacts/bbbc038/
          cp "$OUT_ROOT/official_test_per_image.csv" artifacts/bbbc038/
          cp "$OUT_ROOT/calibration_selection.json" artifacts/bbbc038/
          cp "$OUT_ROOT/frozen_parameters.json" artifacts/bbbc038/
          cp "$OUT_ROOT/official_test/benchmark_report.json" artifacts/bbbc038/
          echo "## Real BBBC038 benchmark" >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT_ROOT/REAL_BBBC038_RESULTS.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain data provenance and real results, not proprietary images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbbc038-real-official-stage1-results
          path: artifacts/bbbc038/
          if-no-files-found: warn
          retention-days: 90
