name: Real microscopy TIFF workflow and independent transfer pilot
on:
  push:
    branches: ['feature/real-data-workflow']
  pull_request:
    paths:
      - 'index.html'
      - 'src/ui-first.js'
      - 'src/p01-worker.mjs'
      - 'src/course-adapter.js'
      - 'projects/real-microscopy/**'
      - 'tests/test_real_*'
      - '.github/workflows/real-microscopy-project.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-image-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install scientific libraries for reproducible original TIFFs
        run: python -m pip install -r projects/real-microscopy/requirements.txt
      - name: JavaScript and frozen-shell checks
        run: |
          node --check src/ui-first.js
          node --check src/course-adapter.js
          node --check src/p01-worker.mjs
          node --test tests/preview.test.mjs tests/witz_sources.test.mjs
      - name: Native OME-TIFF original pixel and pipeline integrity
        run: python tests/test_real_microscopy_pipeline.py
      - name: Existing 13 microscopy chapters and changed-input practice
        run: |
          python tests/test_microscopy_complete_import.py
          python tests/test_scientific_foundation_import.py
          python tests/test_microscopy_complete_reference.py
  browser-source-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install browser & scientific libraries
        run: |
          python -m pip install -r projects/real-microscopy/requirements.txt
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Original 16-bit OME-TIFF import in real Pyodide
        run: python tests/test_real_image_io_browser.py
      - name: Retain responsive UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-microscopy-project-browser
          path: artifacts/real-microscopy/*.png
          if-no-files-found: ignore
          retention-days: 14
