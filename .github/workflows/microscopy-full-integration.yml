name: Full I01-I13 microscopy learner pilot
on:
  push:
    branches: ['integration/microscopy-i05-i13-complete']
  pull_request:
    paths:
      - 'src/course-adapter.js'
      - 'content/i05/**'
      - 'content/i06/**'
      - 'content/i09/**'
      - 'content/i10/**'
      - 'content/i11/**'
      - 'content/i12/**'
      - 'content/i13/**'
      - 'tests/test_microscopy_complete*'
      - '.github/workflows/microscopy-full-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-microscopy:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install scientific packages
        run: python -m pip install numpy scipy scikit-image pandas matplotlib pillow
      - name: Frozen UI and JavaScript syntax
        run: |
          node --check src/course-adapter.js
          node --check src/p01-worker.mjs
          node --test tests/preview.test.mjs tests/witz_sources.test.mjs
      - name: Validate all new and original scientific missions
        run: |
          python tests/test_microscopy_complete_import.py
          python tests/test_scientific_foundation_import.py
          python tests/test_microscopy_complete_reference.py
          python tests/test_scientific_foundation_reference.py
      - name: Preserve original six Python foundation modules
        run: |
          python tests/test_p01_import.py
          python tests/test_p02_import.py
          python tests/test_p03_import.py
          python tests/test_p04_p06_import.py
          python tests/test_p04_p06_reference.py
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Frozen editor and Python P01 browser regressions
        run: |
          python tests/browser_smoke.py
          python tests/test_p01_browser.py
      - name: Existing microscopy Pyodide regression
        run: |
          python tests/test_i01_browser.py
          python tests/test_scientific_foundation_browser.py
      - name: Complete new microscopy Pyodide validation
        run: python tests/test_microscopy_complete_browser.py
      - name: Keep real-browser QA screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-microscopy-e2e
          path: artifacts/microscopy-full/*.png
          if-no-files-found: ignore
          retention-days: 14
